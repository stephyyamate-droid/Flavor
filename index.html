<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flavor Browser</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script defer src="script.js"></script>

</head>

<body>

<div class="aurora"></div>

<div class="window">

<header>

<div class="window-buttons">

<span class="red"></span>
<span class="yellow"></span>
<span class="green"></span>

</div>

<div class="tabs">

<div class="tab active">
<img src="assets/icon.png">
<span>Flavor</span>
</div>

<div class="tab">
<span>+</span>
</div>

</div>

<div class="profile">

<button>⚙</button>
<button>👤</button>

</div>

</header>

<div class="content">

<aside>

<div class="nav active">🏠</div>

<div class="nav">⭐</div>

<div class="nav">📑</div>

<div class="nav">⬇</div>

<div class="nav">🤖</div>

</aside>

<main>

<section class="hero">

<img src="assets/icon.png" class="logo">

<h1>Flavor</h1>

<p>Modern. Fast. Yours.</p>

<div class="search">

<input
id="searchInput"
placeholder="Search or enter a website">

<button id="goButton">

Search

</button>

</div>

</section>

<section class="quick-links">

<div class="card">
<img src="https://www.google.com/favicon.ico">
<span>Google</span>
</div>

<div class="card">
<img src="https://github.githubassets.com/favicons/favicon.svg">
<span>GitHub</span>
</div>

<div class="card">
<img src="https://www.youtube.com/favicon.ico">
<span>YouTube</span>
</div>

<div class="card">
<img src="https://openai.com/favicon.ico">
<span>ChatGPT</span>
</div>

<div class="card">
<img src="https://www.redditstatic.com/desktop2x/img/favicon/favicon-32x32.png">
<span>Reddit</span>
</div>

<div class="card">
<img src="https://www.spotify.com/favicon.ico">
<span>Spotify</span>
</div>

</section>

</main>

</div>

</div>

</body>
</html>
