<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flavor • Settings</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="window">

<header>

<div class="logo">

<img src="../assets/logo/flavor-logo.png" alt="Flavor Logo">

<h2>Flavor</h2>

</div>

<div class="profile">

<button onclick="location.href='../index.html'">🏠 Home</button>

</div>

</header>

<main class="settings">

<h1>Settings</h1>

<p>Customize your Flavor Browser experience.</p>

<div class="settings-grid">

<div class="setting-card">

<h2>🎨 Appearance</h2>

<label>

Theme

<select>

<option>Dark</option>

<option>Light</option>

<option>System</option>

</select>

</label>

<label>

Accent Color

<select>

<option>Purple</option>

<option>Blue</option>

<option>Green</option>

<option>Pink</option>

</select>

</label>

</div>

<div class="setting-card">

<h2>🔍 Search</h2>

<label>

Default Search Engine

<select>

<option>Google</option>

<option>Bing</option>

<option>DuckDuckGo</option>

<option>Yahoo</option>

</select>

</label>

</div>

<div class="setting-card">

<h2>🖼 Homepage</h2>

<label>

Wallpaper

<select>

<option>Default</option>

<option>Mountains</option>

<option>Aurora</option>

<option>Abstract</option>

</select>

</label>

</div>

<div class="setting-card">

<h2>⚡ Performance</h2>

<label>

<input type="checkbox" checked>

Enable Animations

</label>

<br>

<label>

<input type="checkbox" checked>

Smooth Scrolling

</label>

</div>

<div class="setting-card">

<h2>🤖 AI</h2>

<label>

<input type="checkbox">

Enable AI Assistant

</label>

</div>

<div class="setting-card">

<h2>ℹ About</h2>

<p><strong>Flavor Browser</strong></p>

<p>Version 1.0.0</p>

<p>Built with HTML, CSS & JavaScript.</p>

</div>

</div>

</main>

</div>

<script src="../script.js"></script>

</body>

</html>
